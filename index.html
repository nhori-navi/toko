<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f4c53">
<title>ミルビー｜ミルトコ</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<script>
// 描き始める前に明るさを決める（白く光らないように）。MichiMiru の中では MichiMiru に合わせ、単独ではスマホの設定と MichiMiru の設定
(function () {
  let dark = false;
  try { if (window.parent !== window && typeof parent.miruTheme === 'function') dark = !!parent.miruTheme().dark; else throw 0; }
  catch (e) {
    let m = 'auto'; try { m = localStorage.getItem('walk_theme') || 'auto'; } catch (e2) {}
    dark = m === 'dark' || (m !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  }
  document.documentElement.classList.toggle('dark', dark);
})();
</script>
<style>
:root{--bg:#f4f1e8;--card:#fff;--ink:#1f2b2a;--sub:#5f6d6a;--line:#e2ded2;--brand:#2f4c53;--brand2:#3f6e74;--mk:#fbf8ee;--mkb:#d9cfae;--chip:#efe9d8;--chipOn:#2f4c53;--ok:#2e7d4f;--warn:#9a6a12;--say:#fffdf4}
:root.dark{--bg:#18201f;--card:#232c2b;--ink:#eef2f0;--sub:#b5c1bd;--line:#35403e;--brand:#9cc7c6;--brand2:#7fb0b0;--mk:#2a3230;--mkb:#4d5a4f;--chip:#33403d;--chipOn:#7fb0b0;--ok:#8fd4a8;--warn:#e9c27a;--say:#2c3634}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#pg{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}
#hd{display:flex;align-items:center;gap:8px;padding:2px 2px 10px}
#hd img{width:26px;height:26px;border-radius:7px}
#hd b{font-size:17px;color:var(--brand)}
#bpTop{margin-left:auto;font-size:14px;color:var(--brand);text-decoration:none;padding:6px 4px}
#bpTop[hidden]{display:none}
/* 景色 */
.scene{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/2;background:#dfe9e6}
.scene .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
:root.dark .scene .bg{filter:brightness(.72) saturate(.9)}
#bpArt{position:absolute;right:10%;bottom:4%;height:86%;transform-origin:50% 100%;cursor:pointer}
#bpArt.tilt{transform:rotate(-7deg)}
#bpArt.shake{animation:tkShake .32s linear 3}
@keyframes tkShake{0%,100%{translate:0}25%{translate:-4px}75%{translate:4px}}
#bpSay{position:absolute;left:10px;top:10px;max-width:62%;background:var(--say);border:1.5px solid var(--mkb);border-radius:14px;padding:8px 12px;font-size:16px;line-height:1.45;box-shadow:0 2px 6px rgba(0,0,0,.14);opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;pointer-events:none}
#bpSay.on{opacity:1;transform:none}
#bpSay.tap{pointer-events:auto;cursor:pointer}
#bpSay::after{content:"";position:absolute;right:-9px;top:16px;border:8px solid transparent;border-left-color:var(--mkb)}
#bpSay .nx{display:block;text-align:right;font-size:12px;color:var(--sub);margin-top:2px}
.stg{display:flex;align-items:baseline;gap:8px;margin:8px 2px 0;flex-wrap:wrap}
.stg b{font-size:17px}
.sub{color:var(--sub);font-size:12px}
/* きょうのみちくさ */
.mk{margin-top:12px;background:var(--mk);border:2px solid var(--mkb);border-radius:18px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.mkHd{display:flex;align-items:center;gap:6px}
.mkT{font-weight:bold;font-size:14px;color:var(--brand)}
.mkHd2{display:flex;margin-top:6px}
.mkDist{display:flex;background:var(--chip);border-radius:16px;padding:2px}
.mkDist button{border:0;background:transparent;padding:5px 12px;border-radius:14px;font-size:13px;min-height:32px;color:var(--sub)}
.mkDist button.on{background:var(--chipOn);color:#fff;font-weight:bold}
:root.dark .mkDist button.on{color:#14201f}
.mkBody{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.mkTx{flex:1;min-width:0}
.mkQ{font-size:21px;font-weight:bold;line-height:1.35}
.mkS{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.mkApp{flex:none;border:0;background:transparent;padding:0;margin:2px 0 0;width:48px;height:48px}
.mkApp img{width:48px;height:48px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.25);display:block}
.mkFt{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:40px;flex-wrap:wrap}
.mkSt{font-size:13px;color:var(--sub)}
.mkSt b{color:var(--ink)}
.mkDone{font-weight:bold;color:var(--ok);font-size:16px}
.mkWait{font-size:12px;color:var(--warn);width:100%}
.mkBtn{border:1px solid var(--brand2);background:var(--brand);color:#fff;border-radius:12px;padding:8px 16px;min-height:42px;font-weight:bold;font-size:15px}
:root.dark .mkBtn{color:#14201f}
.mkSub{border:1px solid var(--line);background:transparent;border-radius:12px;padding:6px 12px;min-height:38px;font-size:13px;color:var(--sub)}
.mkRr{margin-left:auto}
/* これまで・持ち物 */
.stats{display:flex;gap:10px;margin-top:12px}
.stats div{flex:1;background:var(--card);border-radius:14px;padding:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stats b{display:block;font-size:24px;color:var(--brand)}
.stats small{font-size:12px;color:var(--sub)}
.box{background:var(--card);border-radius:14px;padding:12px;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:14px;line-height:1.7}
.box h3{margin:0 0 4px;font-size:15px;color:var(--brand)}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.shelf div{background:var(--mk);border:1px dashed var(--mkb);border-radius:12px;text-align:center;padding:8px 2px 6px;font-size:11px;color:var(--sub);line-height:1.35}
.shelf .e{display:block;font-size:30px;line-height:1.2}
.shelf .no .e{filter:grayscale(1) brightness(0);opacity:.18}
.shelf .got{border-style:solid}
.shelf .got span:not(.e){color:var(--ink)}
.lnk{border:1px solid var(--brand2);background:transparent;color:var(--brand);border-radius:12px;padding:6px 12px;min-height:38px;font-size:14px;margin-top:6px}
#bpVer{text-align:center;margin-top:16px}
</style>
</head>
<body>
<div id="pg">
  <header id="hd"><img src="img/icon.svg" alt=""><b>ミルビー</b><a id="bpTop" href="../">◀ TOP</a></header>
  <div class="scene"><img class="bg" id="bpBg" alt=""><img id="bpArt" alt="ミルビー"><div id="bpSay" aria-live="polite"></div></div>
  <div class="stg" id="bpStage"></div>
  <section class="mk" id="mk" aria-live="polite"></section>
  <div class="stats" id="bpStats"></div>
  <div class="box"><h3>持ち物</h3><div class="sub">それぞれのミルのみちくさを初めて達成すると、ミルビーが持ち物をもらいます</div><div class="shelf" id="bpShelf"></div></div>
  <div class="box"><h3 id="bpBadge">🏅 Miru バッジ</h3><div class="sub">4つのミルにまたがるバッジ。MichiMiru の散歩日記の、いちばん下にあります</div><button class="lnk" type="button" id="bpNikki">散歩日記を見る</button></div>
  <div class="box"><h3>きょうのみちくさ</h3><div class="sub" style="line-height:1.7">毎朝4時に、小さなお題が1つ出ます。「近所・散歩・遠出」で距離を選べます。気に入らなければ「↻ 引き直す」（距離ごとに1回）。「歩けば自動で判定」のお題は、MichiMiru で記録して歩くと判定します。［できた］のお題は自分で押します（その日のうちなら取り消せます）。達成として数えるのは1日1回。できなかった日も、次の朝に静かに入れ替わるだけです。</div></div>
  <div class="sub" id="bpVer"></div>
</div>
<script src="lib.js?v=4"></script>
<script src="michikusa.js?v=4"></script>
<script src="bee.js?v=4"></script>
<script>beeInit();</script>
</body>
</html>
