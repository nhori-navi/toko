<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f4c53">
<title>ミルトコ</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<script>
// 描き始める前に明るさを決める（白く光らないように）。MichiMiru の中では MichiMiru に合わせ、単独ではスマホの設定と MichiMiru の設定
(function () {
  let dark = false;
  try { if (window.parent !== window && typeof parent.miruTheme === 'function') dark = !!parent.miruTheme().dark; else throw 0; }
  catch (e) {
    let m = 'auto'; try { m = localStorage.getItem('walk_theme') || 'auto'; } catch (e2) {}
    dark = m === 'dark' || (m !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  }
  document.documentElement.classList.toggle('dark', dark);
})();
</script>
<style>
:root{--bg:#f4f1e8;--card:#fff;--ink:#1f2b2a;--sub:#5f6d6a;--line:#e2ded2;--brand:#2f4c53;--brand2:#3f6e74;--mk:#fbf8ee;--mkb:#d9cfae;--chip:#efe9d8;--chipOn:#2f4c53;--ok:#2e7d4f;--warn:#9a6a12;--say:#fffdf4}
:root.dark{--bg:#18201f;--card:#232c2b;--ink:#eef2f0;--sub:#b5c1bd;--line:#35403e;--brand:#9cc7c6;--brand2:#7fb0b0;--mk:#2a3230;--mkb:#4d5a4f;--chip:#33403d;--chipOn:#7fb0b0;--ok:#8fd4a8;--warn:#e9c27a;--say:#2c3634}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 0}
#hd{display:flex;align-items:center;gap:8px;padding:2px 2px 8px}
#hd img{width:26px;height:26px;border-radius:7px}
#hd b{font-size:16px;letter-spacing:.08em;color:var(--brand)}
#hd .day{margin-left:auto;font-size:13px;color:var(--sub)}
/* きょうのみちくさ */
.mk{background:var(--mk);border:2px solid var(--mkb);border-radius:18px;padding:10px 12px 10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.mkHd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mkT{font-weight:bold;font-size:14px;color:var(--brand)}
.mkDist{margin-left:auto;display:flex;background:var(--chip);border-radius:16px;padding:2px}
.mkDist button{border:0;background:transparent;padding:5px 11px;border-radius:14px;font-size:13px;min-height:32px;color:var(--sub)}
.mkDist button.on{background:var(--chipOn);color:#fff;font-weight:bold}
:root.dark .mkDist button.on{color:#14201f}
.mkBody{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.mkTx{flex:1;min-width:0}
.mkQ{font-size:21px;font-weight:bold;line-height:1.35}
.mkS{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.mkApp{flex:none;border:0;background:transparent;padding:0;margin:2px 0 0;width:48px;height:48px}
.mkApp img{width:48px;height:48px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.25);display:block}
.mkFt{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:40px;flex-wrap:wrap}
.mkSt{font-size:13px;color:var(--sub)}
.mkSt b{color:var(--ink)}
.mkDone{font-weight:bold;color:var(--ok);font-size:16px}
.mkWait{font-size:12px;color:var(--warn);width:100%}
.mkBtn{border:1px solid var(--brand2);background:var(--brand);color:#fff;border-radius:12px;padding:8px 16px;min-height:42px;font-weight:bold;font-size:15px}
:root.dark .mkBtn{color:#14201f}
.mkSub{border:1px solid var(--line);background:transparent;border-radius:12px;padding:6px 12px;min-height:38px;font-size:13px;color:var(--sub)}
.mkRr{margin-left:auto}
/* 4つのミル */
#apps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.app{position:relative;display:flex;align-items:center;gap:10px;border:0;border-left:6px solid var(--c);background:var(--card);border-radius:14px;padding:12px 10px;min-height:76px;text-align:left;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.app img{width:44px;height:44px;border-radius:11px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.app b{display:block;font-size:18px}
.app small{display:block;font-size:12px;color:var(--sub)}
.app .it{position:absolute;right:6px;top:4px;font-size:18px;line-height:1}
#recBar{display:none;margin-top:10px;width:100%;border:0;border-radius:12px;background:#1e7e34;color:#fff;padding:9px 12px;font-size:15px;font-weight:bold;text-align:left;min-height:42px}
#recBar.on{display:block}
#recBar.veh{background:#55606a}
/* 下 */
#ft{margin-top:auto;display:flex;align-items:flex-end;gap:8px;padding:14px 0 0;min-height:112px}
#ftL{flex:1;padding-bottom:max(12px,env(safe-area-inset-bottom));font-size:13px;color:var(--sub);line-height:2}
#ftL button{border:0;background:transparent;padding:4px 2px;color:var(--sub);text-decoration:underline;text-underline-offset:3px;font-size:13px;min-height:32px}
#adSlot{height:0}
/* ミルビー（右下の隅） */
#bee{position:relative;flex:none;width:96px;height:96px;border:0;background:transparent;padding:0;margin:0 -4px 0 0;cursor:pointer}
#bee img{width:96px;height:96px;display:block;transform-origin:70% 100%}
#bee.off{display:none}
#bee.shake img{animation:tkShake .32s linear 3}
#bee .dot{position:absolute;right:4px;top:2px;width:12px;height:12px;border-radius:6px;background:#e0533d;display:none;box-shadow:0 0 0 2px var(--bg)}
#bee.new .dot{display:block}
@keyframes tkShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
#say{position:absolute;right:100px;bottom:58px;max-width:200px;background:var(--say);border:1.5px solid var(--mkb);border-radius:14px;padding:7px 11px;font-size:15px;line-height:1.4;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12);opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;pointer-events:none}
#say.on{opacity:1;transform:none}
#say::after{content:"";position:absolute;right:-8px;bottom:12px;border:7px solid transparent;border-left-color:var(--mkb)}
#ftR{position:relative}
/* 重ねる画面（設定・使い方・出典・ミルビーのページ） */
#sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none;padding:max(8px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}
#sheet.on{display:block}
#sheet .in{max-width:560px;margin:0 auto}
#shHd{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:4px 0 8px;z-index:1}
#shBack{border:0;background:transparent;font-size:15px;color:var(--brand);padding:8px 6px;min-height:42px;font-weight:bold}
#shT{font-size:17px;font-weight:bold}
.box{background:var(--card);border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:14px;line-height:1.7}
.box h3{margin:0 0 4px;font-size:15px;color:var(--brand)}
.box p{margin:4px 0}
.sw{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer}
.sw span{flex:1;line-height:1.4}.sw small{display:block;font-size:12px;color:var(--sub)}
.sw input{appearance:none;-webkit-appearance:none;flex:0 0 52px;width:52px;height:30px;margin:0;border-radius:15px;background:#c9d3cd;position:relative;transition:background .15s;cursor:pointer}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw input:checked{background:var(--brand2)}.sw input:checked::after{left:25px}
.sub{color:var(--sub);font-size:12px}
.lnk{border:1px solid var(--brand2);background:transparent;color:var(--brand);border-radius:12px;padding:6px 12px;min-height:38px;font-size:14px}
/* ミルビーのページ */
.scene{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/2;background:#dfe9e6;margin-top:4px}
.scene .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
:root.dark .scene .bg{filter:brightness(.72) saturate(.9)}
.scene .bd{position:absolute;left:50%;bottom:4%;height:86%;transform:translateX(-50%);transform-origin:50% 100%}
.scene .bd.tilt{transform:translateX(-50%) rotate(-7deg)}
.scene .say2{position:absolute;left:8px;top:8px;background:var(--say);border:1.5px solid var(--mkb);border-radius:12px;padding:5px 10px;font-size:14px}
.stg{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.stg b{font-size:18px}
.stats{display:flex;gap:10px;margin-top:10px}
.stats div{flex:1;background:var(--card);border-radius:14px;padding:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stats b{display:block;font-size:24px;color:var(--brand)}
.stats small{font-size:12px;color:var(--sub)}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.shelf div{background:var(--mk);border:1px dashed var(--mkb);border-radius:12px;text-align:center;padding:8px 2px 6px;font-size:11px;color:var(--sub);line-height:1.35}
.shelf .e{display:block;font-size:30px;line-height:1.2}
.shelf .no .e{filter:grayscale(1) brightness(0);opacity:.18}
.shelf .got{border-style:solid}
.shelf .got span:not(.e){color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <header id="hd"><img src="img/icon.svg" alt=""><b>ミルトコ</b><span class="day" id="day"></span></header>
  <section class="mk" id="mk" aria-live="polite"></section>
  <section id="apps"></section>
  <button id="recBar" type="button"></button>
  <footer id="ft">
    <div id="ftL"><button type="button" data-sh="set">設定</button>・<button type="button" data-sh="help">使い方</button>・<button type="button" data-sh="src">データの出典</button><div id="adSlot"></div></div>
    <div id="ftR"><div id="say"></div><button id="bee" type="button" aria-label="ミルビーのページ"><img id="beeImg" alt=""><span class="dot"></span></button></div>
  </footer>
</div>
<div id="sheet" role="dialog"><div class="in"><div id="shHd"><button id="shBack" type="button">◀ ホーム</button><span id="shT"></span></div><div id="shBody"></div></div></div>
<script src="toko.js?v=1"></script>
<script src="michikusa.js?v=1"></script>
<script src="bee.js?v=1"></script>
<script>tkInit();</script>
</body>
</html>
